[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ehl-solver"
version = "0.1.0"
description = "Research-grade elastohydrodynamic lubrication solver (work in progress)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gpu = ["torch>=2.4"]

[project.scripts]
ehl-check = "ehl_solver.cli:main"
ehl-hardware = "ehl_solver.hardware_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ehl_solver = ["_hip_native.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
